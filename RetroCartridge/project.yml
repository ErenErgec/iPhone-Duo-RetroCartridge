name: RetroCartridge
options:
  bundleIdPrefix: com.retrocartridge
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  defaultConfig: Release
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: false
    INFOPLIST_FILE: RetroCartridge/Info.plist
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_PREVIEWS: true
    SWIFT_EMIT_LOC_STRINGS: true
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    TARGETED_DEVICE_FAMILY: "1"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  RetroCartridge:
    type: application
    platform: iOS
    sources:
      - path: RetroCartridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.retrocartridge.app
        CODE_SIGN_STYLE: Automatic
    info:
      path: RetroCartridge/Info.plist

  RetroCartridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RetroCartridgeTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.retrocartridge.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RetroCartridge.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/RetroCartridge"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: RetroCartridge
